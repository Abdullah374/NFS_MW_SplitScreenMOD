; NFS Most Wanted (2005) - Split Screen mod
; Adds "Split Screen" to the Quick Race menu (2 players, 1 PC), with optional AI racers and traffic.
;
; In split screen races each player uses an XInput controller (Xbox-style pad, or any pad through
; Steam Input / DS4Windows) or the keyboard, picked on the join screen before car selection.
; Each player's buttons are changed in-game: pause menu > Options > 2P CONTROLS.
; Traffic, AI racers, AI difficulty and catch up are set on the race options screen after picking a track.

[SplitScreen]
Enabled=1
; 0 = top / bottom, 1 = side by side
Layout=0
; Show the "press a button to join" screen before car selection (0 = skip it)
JoinScreen=1
; Let both players' controllers navigate menus (car select, pause menu)
Player2MenuControl=1
; Car memory pool for 2 player races in KB (0 = same as 1 player)
TwoPlayerCarMemoryKB=0
; How much wider each half-screen view is (0 = console style: same width as full screen, 1 = widest)
ViewWidening=0.25
; Give each player their own minimap (0 = one shared map like the console version)
SeparateMinimaps=1
; Most AI racers you can pick on the split screen race options screen (0-4)
MaxAIRacers=4
; Colour of AI racers on the minimaps (hex RGB)
AIMinimapColor=FF3C3C
; Show each player's score in split screen speed trap races (0 = off)
ShowSpeedTrapScore=1
; Shuffle the starting grid (both players and the AI) in split screen races (0 = fixed order)
RandomStartGrid=1
; Size of each minimap (1.0 = original size)
MinimapScale=0.8
; Black line between the two views (0 = none)
DividerPixels=2
; Motion blur in split screen (1 causes ghosting of the other player's view)
MotionBlur=0
; F12 saves a screenshot (ScreenshotNNN.tga). 1 = also take two automatically at the start of each split race
AutoScreenshots=0
; Write NFSMWSplitScreen.log in the game folder
DebugLog=0

[Player2]
StickDeadzone=7849
TriggerThreshold=30

; Devices and button bindings for both players are saved to NFSMWSplitScreen_Controls.ini.
